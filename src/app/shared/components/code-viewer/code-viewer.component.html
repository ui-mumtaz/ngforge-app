<div class="relative flex flex-col h-full rounded-xl overflow-hidden border bg-slate-950 border-slate-800 text-slate-100">
  <!-- Top Header -->
  <div class="flex items-center justify-between px-4 py-2.5 text-xs font-mono border-b bg-slate-900/90 border-slate-800 text-slate-400">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-red-500/80 inline-block"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500/80 inline-block"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 inline-block"></span>
      <span class="ml-2 font-medium text-slate-200">{{ fileName() }}</span>
      <span class="text-slate-500 text-[11px]">({{ lines().length }} lines)</span>
    </div>

    <button
      type="button"
      [cdkCopyToClipboard]="code()"
      (cdkCopyToClipboardCopied)="onCopied($event)"
      class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors text-xs cursor-pointer border border-slate-700"
    >
      @if (copied()) {
        <span class="text-emerald-400 font-medium">✓ Copied!</span>
      } @else {
        <span>📋 Copy</span>
      }
    </button>
  </div>

  <!-- Code Body -->
  <div class="flex-1 overflow-auto p-4 font-mono text-[13px] leading-relaxed select-text">
    <div class="flex min-w-full">
      <!-- Line Numbers -->
      <div class="select-none pr-4 text-right text-slate-600 font-mono text-xs opacity-75 shrink-0 border-r border-slate-800 mr-4">
        @for (line of lines(); track $index) {
          <div class="leading-relaxed">{{ $index + 1 }}</div>
        }
      </div>

      <!-- Highlighted Pre -->
      <pre class="m-0 p-0 bg-transparent overflow-visible flex-1"><code #codeElement [class]="'language-' + language() + ' whitespace-pre'">{{ code() }}</code></pre>
    </div>
  </div>
</div>
