<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      animate.enter="toast-enter"
      animate.leave="toast-leave"
      class="pointer-events-auto flex items-center justify-between p-3.5 rounded-xl shadow-xl border text-xs"
      [class.bg-emerald-950/90]="toast.type === 'success'"
      [class.text-emerald-200]="toast.type === 'success'"
      [class.border-emerald-800]="toast.type === 'success'"
      [class.bg-amber-950/90]="toast.type === 'warning'"
      [class.text-amber-200]="toast.type === 'warning'"
      [class.border-amber-800]="toast.type === 'warning'"
      [class.bg-slate-900/90]="toast.type === 'info'"
      [class.text-slate-200]="toast.type === 'info'"
      [class.border-slate-800]="toast.type === 'info'"
    >
      <div class="flex items-center gap-2">
        <span>{{ toast.type === 'success' ? '✓' : toast.type === 'warning' ? '⚠' : 'ℹ' }}</span>
        <span>{{ toast.message }}</span>
      </div>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="text-slate-400 hover:text-white p-1 ml-2 cursor-pointer"
      >
        ✕
      </button>
    </div>
  }
</div>
