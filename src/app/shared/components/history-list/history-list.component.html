<div class="flex flex-col h-full" [formGroup]="filterForm">
  <!-- Search & Filter -->
  <div class="p-3 border-b border-slate-200 dark:border-slate-800 space-y-2">
    <input
      type="text"
      formControlName="query"
      placeholder="Search history..."
      class="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:border-red-500"
    />

    <div class="flex items-center justify-between">
      <button
        type="button"
        (click)="filterForm.controls.favoritesOnly.setValue(!filterForm.controls.favoritesOnly.value)"
        class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium cursor-pointer"
        [class.bg-amber-500/10]="filterForm.controls.favoritesOnly.value"
        [class.text-amber-500]="filterForm.controls.favoritesOnly.value"
        [class.border]="filterForm.controls.favoritesOnly.value"
        [class.border-amber-500/30]="filterForm.controls.favoritesOnly.value"
        [class.bg-slate-200]="!filterForm.controls.favoritesOnly.value"
        [class.dark:bg-slate-800]="!filterForm.controls.favoritesOnly.value"
        [class.text-slate-500]="!filterForm.controls.favoritesOnly.value"
        [class.dark:text-slate-400]="!filterForm.controls.favoritesOnly.value"
      >
        <span>★ Favorites Only</span>
      </button>

      <button
        type="button"
        (click)="history.exportJson()"
        class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer"
      >
        Export JSON
      </button>
    </div>

    @if (reorderDisabled()) {
      <p class="text-[10px] text-slate-400">Clear filters to drag-reorder items.</p>
    }
  </div>

  <!-- History Item List -->
  <div
    class="flex-1 overflow-y-auto p-3 space-y-2"
    cdkDropList
    [cdkDropListDisabled]="reorderDisabled()"
    (cdkDropListDropped)="drop($event)"
  >
    @for (item of filteredList(); track item.id) {
      <div
        cdkDrag
        [cdkDragDisabled]="reorderDisabled()"
        (click)="selectItem(item)"
        class="p-3 rounded-xl border text-xs cursor-pointer transition-all relative group bg-white dark:bg-slate-950/40"
        [class.border-red-500]="history.currentOutput().id === item.id"
        [class.bg-red-500/10]="history.currentOutput().id === item.id"
        [class.border-slate-200]="history.currentOutput().id !== item.id"
        [class.dark:border-slate-800]="history.currentOutput().id !== item.id"
      >
        <div class="flex items-start justify-between gap-2 mb-1">
          <span class="font-semibold line-clamp-1 text-slate-800 dark:text-slate-200">{{ item.title }}</span>
          <button
            type="button"
            (click)="$event.stopPropagation(); history.toggleFavorite(item.id)"
            class="text-xs cursor-pointer shrink-0"
            [class.text-amber-500]="item.isFavorite"
            [class.text-slate-400]="!item.isFavorite"
          >
            ★
          </button>
        </div>

        <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2 leading-snug mb-2">
          {{ item.prompt }}
        </p>

        <div class="flex items-center justify-between text-[10px] text-slate-500 font-mono">
          <span class="px-1.5 py-0.5 rounded bg-red-500/10 text-red-500 font-semibold">
            {{ item.type }}
          </span>
          <button
            type="button"
            (click)="$event.stopPropagation(); history.deleteItem(item.id)"
            class="opacity-0 group-hover:opacity-100 hover:text-red-500 transition-opacity cursor-pointer"
          >
            Delete
          </button>
        </div>
      </div>
    } @empty {
      <div class="text-center py-10 text-slate-400 text-xs">
        No matching history found.
      </div>
    }
  </div>

  <!-- Clear All Footer -->
  <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center text-[11px] text-slate-500 dark:text-slate-400">
    <span>{{ history.items().length }} recorded</span>
    <button type="button" (click)="history.clear()" class="text-red-500 hover:underline cursor-pointer">
      Clear All
    </button>
  </div>
</div>
