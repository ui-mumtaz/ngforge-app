<ng-template #drawerTemplate>
  <div
    class="h-full w-80 md:w-96 flex flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-2xl transition-transform duration-200 ease-out"
    [class.translate-x-0]="visible()"
    [class.-translate-x-full]="!visible()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-red-500 font-bold">⏱</span>
        <h3 class="font-bold text-sm">Generation History</h3>
        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
          {{ history.items().length }}
        </span>
      </div>

      <button
        type="button"
        (click)="history.closeDrawer()"
        class="p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer"
      >
        ✕
      </button>
    </div>

    <app-history-list [compact]="true" class="flex-1 min-h-0" />
  </div>
</ng-template>
